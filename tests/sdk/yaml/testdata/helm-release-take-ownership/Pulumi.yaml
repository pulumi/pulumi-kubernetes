name: helm-release-take-ownership
runtime: yaml
description: A v3 Release adopts a pre-existing ConfigMap when takeOwnership is set.
config:
  namespace:
    type: string
  takeOwnership:
    type: boolean
    default: false
resources:
  adopt:
    type: kubernetes:helm.sh/v3:Release
    properties:
      name: adopt-test
      namespace: ${namespace}
      chart: ./adopt-chart
      takeOwnership: ${takeOwnership}
