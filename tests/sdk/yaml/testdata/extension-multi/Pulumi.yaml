name: extension-multi
runtime: yaml
description: |
  Create resources served by two different extension-parameterized packages
  (dragon-ext, unicorn-ext) plus a base-provider resource, all on one kubernetes
  provider instance. Both packages are added from the local provider by the
  test's setup step.

resources:
  ns:
    type: kubernetes:core/v1:Namespace
    properties:
      metadata:
        name: multiext-system

  crds:
    type: kubernetes:yaml/v2:ConfigGroup
    properties:
      files:
        - dragon-crds.yaml
        - unicorn-crds.yaml

  dragon:
    type: dragon-ext:dragon.multiext.pulumi.com/v1:Dragon
    options:
      dependsOn:
        - ${crds}
        - ${ns}
    properties:
      metadata:
        name: dragon
        namespace: multiext-system
      spec:
        scaleColor: green

  unicorn:
    type: unicorn-ext:unicorn.multiext.pulumi.com/v1:Unicorn
    options:
      dependsOn:
        - ${crds}
        - ${ns}
    properties:
      metadata:
        name: unicorn
        namespace: multiext-system
      spec:
        hornLength: 3

outputs:
  dragonName: ${dragon.metadata.name}
  dragonScaleColor: ${dragon.spec.scaleColor}
  unicornName: ${unicorn.metadata.name}
  unicornHornLength: ${unicorn.spec.hornLength}
  namespaceName: ${ns.metadata.name}
